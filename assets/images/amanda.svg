<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Amanda">
  <title>Amanda — estagiária do laboratório</title>
  <desc>Jovem estagiária com cabelo preso, blusa clara e crachá de identificação.</desc>

  <defs>
    <linearGradient id="amBlouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <radialGradient id="amFace" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f2c99f"/>
      <stop offset="100%" stop-color="#dca579"/>
    </radialGradient>
    <radialGradient id="amBg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#e6fafc"/>
      <stop offset="100%" stop-color="#bce8ee"/>
    </radialGradient>
    <clipPath id="amClip"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="98" fill="#e6fafc"/>
  <g clip-path="url(#amClip)">
    <circle cx="100" cy="100" r="96" fill="url(#amBg)"/>

    <!-- Corpo / blusa -->
    <path d="M 14 200 Q 14 152, 100 144 Q 186 152, 186 200 Z" fill="url(#amBlouse)"/>
    <path d="M 86 146 L 100 170 L 114 146"
          fill="none" stroke="#00838f" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Crachá -->
    <rect x="66" y="170" width="20" height="26" rx="2"
          fill="#ffc107" stroke="#c79100" stroke-width="1.5"/>
    <line x1="70" y1="176" x2="82" y2="176" stroke="#c79100" stroke-width="1.5"/>
    <line x1="70" y1="181" x2="82" y2="181" stroke="#c79100" stroke-width="1.5"/>
    <line x1="70" y1="186" x2="78" y2="186" stroke="#c79100" stroke-width="1.5"/>

    <!-- Pescoço -->
    <path d="M 87 118 L 87 150 L 113 150 L 113 118 Z" fill="#c98a5d"/>

    <!-- Orelhas -->
    <ellipse cx="60" cy="110" rx="6" ry="9" fill="#dca579"/>
    <ellipse cx="140" cy="110" rx="6" ry="9" fill="#dca579"/>

    <!-- Coque -->
    <ellipse cx="100" cy="52" rx="18" ry="14" fill="#3a2510"/>

    <!-- Cabelo atrás -->
    <path d="M 56 96 Q 54 56, 100 50 Q 146 56, 144 96
             L 148 130 Q 140 110, 136 100
             L 132 80 Q 130 72, 100 72 Q 70 72, 68 80
             L 64 100 Q 60 110, 52 130 Z"
          fill="#3a2510"/>

    <!-- Rosto -->
    <ellipse cx="100" cy="105" rx="41" ry="45" fill="url(#amFace)"/>

    <!-- Franja -->
    <path d="M 62 96 Q 62 68, 100 64 Q 138 68, 138 96
             Q 132 82, 100 82 Q 68 82, 62 96 Z" fill="#4a3018"/>

    <!-- Sobrancelhas -->
    <path d="M 76 96 Q 84 92, 92 96"
          stroke="#3a2510" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 108 96 Q 116 92, 124 96"
          stroke="#3a2510" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Olhos -->
    <ellipse cx="83" cy="110" rx="4" ry="4.5" fill="#1a2332"/>
    <ellipse cx="117" cy="110" rx="4" ry="4.5" fill="#1a2332"/>
    <circle cx="84.5" cy="108.5" r="1.4" fill="#f5f7fa"/>
    <circle cx="118.5" cy="108.5" r="1.4" fill="#f5f7fa"/>

    <!-- Nariz -->
    <path d="M 100 118 Q 96 126, 103 128"
          stroke="#a86a45" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Bochechas -->
    <circle cx="70" cy="124" r="6" fill="#d97a5a" opacity="0.35"/>
    <circle cx="130" cy="124" r="6" fill="#d97a5a" opacity="0.35"/>

    <!-- Sorriso -->
    <path d="M 88 138 Q 100 148, 112 138"
          stroke="#8a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="100" r="98" fill="none" stroke="#00acc1" stroke-width="3.5"/>
</svg>