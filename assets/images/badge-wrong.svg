<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-label="Medalha de revisão">
  <title>Medalha de revisão</title>

  <defs>
    <radialGradient id="silverGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f0f0f5"/>
      <stop offset="55%" stop-color="#b8b8c8"/>
      <stop offset="100%" stop-color="#6a6a80"/>
    </radialGradient>
    <radialGradient id="centerRed" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <linearGradient id="ribbonRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a5c"/>
      <stop offset="100%" stop-color="#1f1f3a"/>
    </linearGradient>
  </defs>

  <!-- Fitas -->
  <path d="M 72 148 L 62 200 L 82 190 L 92 200 L 100 148 Z" fill="url(#ribbonDark)"/>
  <path d="M 128 148 L 138 200 L 118 190 L 108 200 L 100 148 Z" fill="url(#ribbonRed)"/>

  <!-- Círculo externo prateado -->
  <circle cx="100" cy="100" r="82" fill="url(#silverGrad)"
          stroke="#6a6a80" stroke-width="2"/>

  <!-- Anéis decorativos -->
  <circle cx="100" cy="100" r="72" fill="none"
          stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="70" fill="none"
          stroke="#6a6a80" stroke-width="1" opacity="0.5"/>

  <!-- Círculo interno vermelho -->
  <circle cx="100" cy="100" r="62" fill="url(#centerRed)"
          stroke="#7f1010" stroke-width="2"/>

  <!-- Mão com polegar para baixo -->
  <g transform="translate(100 100)">
    <!-- Punho -->
    <path d="M -22 -6 Q -22 -22, -6 -22 L 14 -22
             Q 26 -22, 26 -6 L 26 14
             Q 26 26, 14 26 L -10 26
             Q -22 26, -22 14 Z"
          fill="#f5efe0" stroke="#3a2a1a" stroke-width="2" stroke-linejoin="round"/>
    <!-- Polegar apontando para baixo -->
    <path d="M -22 0 Q -34 2, -34 14
             Q -34 24, -24 26 L -22 26"
          fill="#f5efe0" stroke="#3a2a1a" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Linhas dos dedos -->
    <line x1="6" y1="-18" x2="6" y2="20"
          stroke="#3a2a1a" stroke-width="1.4" opacity="0.7"/>
    <line x1="16" y1="-14" x2="16" y2="16"
          stroke="#3a2a1a" stroke-width="1.4" opacity="0.7"/>
    <!-- Linha do punho -->
    <line x1="-14" y1="-14" x2="-14" y2="18"
          stroke="#3a2a1a" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- Raios decorativos em vermelho -->
  <g stroke="#ef5350" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="100" y1="40" x2="100" y2="46"/>
    <line x1="140" y1="60" x2="136" y2="64"/>
    <line x1="160" y1="100" x2="154" y2="100"/>
    <line x1="140" y1="140" x2="136" y2="136"/>
    <line x1="100" y1="160" x2="100" y2="154"/>
    <line x1="60" y1="140" x2="64" y2="136"/>
    <line x1="40" y1="100" x2="46" y2="100"/>
    <line x1="60" y1="60" x2="64" y2="64"/>
  </g>
</svg>